mount = "package"
akmon_version = "0.3.0.dev0"
attached_archetype = "package/python"
last_realign = "v0.2.1"         # version of the last attach/realign

[test]
runner = "uv run pytest"        # uv-managed project (see AGENTS.md / CLAUDE.md); release_check runs it verbatim

[d2_ledger]
# Paths where a change is D2-sensitive (math / data shape / architecture; owner-verify guardrail).
# The reminder hook and pre-commit `check` read these. Start narrow, widen on misses (ADR 0007 §4).
sensitive_paths = [
    "src/**/lib/**",           # pure numerics: pricer, analytic, enrichment, normalization, chain
    "src/**/schemas/**",       # pandera models — data-shape contracts
    "src/**/entities/**",      # domain entities / column registry
    "src/**/pricer_class.py",  # pricing facade (math assembly)
]
